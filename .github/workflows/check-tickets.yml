name: "Corona Ice Tracker - Monitorizare Bilete"

on:
  schedule:
    # GitHub folosește ora UTC. 05:00–21:59 UTC acoperă 08:00–23:00 ora României
    # atât iarna (UTC+2), cât și vara (UTC+3). Scriptul oprește singur rulările din afara intervalului.
    - cron: "*/10 5-21 * * *"
  workflow_dispatch: # rulare manuală din tab-ul Actions

permissions:
  contents: write

concurrency:
  group: corona-ticket-monitor
  cancel-in-progress: false

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rulare monitorizare
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Europe/Bucharest"
        run: node scripts/monitor.js

      - name: Commit & push data/matches.json (dacă s-a modificat)
        if: always()
        run: |
          git config user.name "Corona Ice Tracker Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if git diff --staged --quiet; then
            echo "Nicio modificare de salvat."
          else
            git commit -m "Actualizare automată meciuri & știri ($(date +'%Y-%m-%d %H:%M'))"
            git pull --rebase --autostash
            git push
          fi
