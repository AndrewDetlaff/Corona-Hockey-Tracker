name: "Corona Ice Tracker - Live Match Watcher"

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Durata maximă de monitorizare live (minute)"
        required: false
        default: "180"

permissions:
  contents: write

concurrency:
  group: corona-live-match
  cancel-in-progress: true

jobs:
  live-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurare Git
        run: |
          git config user.name "Corona Ice Tracker Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Monitorizare Live (goluri, scor, evenimente la 30s)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Europe/Bucharest"
          MAX_MINUTES: "${{ github.event.inputs.max_minutes || '180' }}"
        run: |
          END_TS=$(( $(date +%s) + MAX_MINUTES * 60 ))
          SAW_LIVE=0
          while [ $(date +%s) -lt $END_TS ]; do
            node scripts/monitor.js --watch-tick || true
            git add data/matches.json
            if ! git diff --staged --quiet; then
              for attempt in 1 2 3; do
                git fetch origin main || break
                if ! git merge-base --is-ancestor origin/main HEAD; then
                  echo "origin/main a avansat concurent — resincronizez snapshot-ul live..."
                  git reset --hard origin/main
                  node scripts/monitor.js --watch-tick --no-notify || true
                  git add data/matches.json
                  if git diff --staged --quiet; then
                    break
                  fi
                fi
                if git diff --staged --quiet; then
                  break
                fi
                git commit -m "Live update ($(date +'%H:%M:%S'))" || true
                if git push origin HEAD:main; then
                  break
                fi
                sleep 2
              done
            fi
            STATUS=$(node -e '
              const fs = require("fs");
              const d = JSON.parse(fs.readFileSync("data/matches.json", "utf8"));
              if (d.activeMatch) { console.log("LIVE"); process.exit(0); }
              const parts = new Intl.DateTimeFormat("en-CA", {
                timeZone: "Europe/Bucharest",
                year: "numeric", month: "2-digit", day: "2-digit",
                hour: "2-digit", minute: "2-digit", hourCycle: "h23"
              }).formatToParts(new Date());
              const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
              const today = `${map.year}-${map.month}-${map.day}`;
              const nowMin = Number(map.hour) * 60 + Number(map.minute);
              const nearStart = (d.matches || []).some(m => {
                if (m.date !== today || m.matchState !== "scheduled") return false;
                if (!m.time) return true;
                const [hh, mm] = m.time.split(":").map(Number);
                if (Number.isNaN(hh) || Number.isNaN(mm)) return true;
                const diff = nowMin - (hh * 60 + mm);
                return diff >= -45 && diff <= 60;
              });
              console.log(nearStart ? "TODAY" : "NONE");
            ')
            echo "Status curent: $STATUS"
            if [ "$STATUS" = "LIVE" ]; then
              SAW_LIVE=1
            elif [ "$SAW_LIVE" = "1" ]; then
              echo "Meciul activ s-a încheiat. Opresc watch-ul."
              break
            elif [ "$STATUS" = "NONE" ]; then
              echo "Niciun meci activ sau în fereastra de start acum. Opresc watch-ul."
              break
            fi
            sleep 30
          done
